services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dynamicconfig-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_password123"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong_password123" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine
    container_name: dynamicconfig-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: dynamicconfig-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/DynamicConfig.Api/Dockerfile
    container_name: dynamicconfig-api
    depends_on:
      sqlserver:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DynamicConfigDb;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True;"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      Jwt__Secret: "DynamicConfigSuperSecretKey_AtLeast32Characters!"
      Jwt__Issuer: "DynamicConfig"
      Jwt__Audience: "DynamicConfigApi"
    ports:
      - "8080:8080"

  sample-service-a:
    build:
      context: .
      dockerfile: src/SampleService.A/Dockerfile
    container_name: dynamicconfig-service-a
    depends_on:
      sqlserver:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8081
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=DynamicConfigDb;User Id=sa;Password=Your_strong_password123;TrustServerCertificate=True;"
      DynamicConfig__RefreshTimerIntervalInMs: 5000
    ports:
      - "8081:8081"

volumes:
  sqlserver_data:
  redis_data: