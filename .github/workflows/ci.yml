name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore DynamicConfig.sln

      - name: Build
        run: dotnet build DynamicConfig.sln --configuration Release --no-restore

      - name: Unit Tests
        run: dotnet test tests/DynamicConfig.UnitTests/DynamicConfig.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=unit-tests.trx" --collect:"XPlat Code Coverage"

      - name: Integration Tests
        run: dotnet test tests/DynamicConfig.IntegrationTests/DynamicConfig.IntegrationTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=integration-tests.trx" --collect:"XPlat Code Coverage"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/*.trx
            **/coverage.cobertura.xml

  docker-build:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/DynamicConfig.Api/Dockerfile
          push: false
          tags: dynamicconfig-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build SampleService.A Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/SampleService.A/Dockerfile
          push: false
          tags: dynamicconfig-service-a:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
